<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Caesar & Vera — Wedding</title>
  <link rel="icon" type="image/x-icon" href="logo.png" />

  <!-- Preconnect & non-blocking Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&display=swap"
    onload="this.rel='stylesheet'">
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&display=swap" rel="stylesheet">
  </noscript>

  <!-- Font Awesome: non-blocking preload then onload -->
  <link rel="preload" as="style" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" onload="this.rel='stylesheet'">
  <noscript>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  </noscript>

  <!-- Critical / Inline CSS (minified-ish) -->
  <style>
    :root{--navy:#0b132b;--cream:#faf3e0;--gold:#c6a664;--max-width:1100px;--nav-height:76px}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:'Cormorant Garamond',serif;color:var(--navy);background:var(--cream);line-height:1.5}
    header.topnav{position:fixed;top:0;left:0;right:0;height:var(--nav-height);display:flex;align-items:center;justify-content:center;z-index:9999;background:linear-gradient(180deg,rgba(11,19,43,0.48),rgba(11,19,43,0.32));padding:0 18px}
    .nav-inner{max-width:var(--max-width);width:100%;display:flex;justify-content:space-between;align-items:center;padding:0 22px}
    nav.navbar{display:flex;gap:28px;transition:all .3s ease}
    nav.navbar a{color:var(--cream);text-decoration:none;font-weight:600;letter-spacing:1px;font-size:14px;opacity:.95;padding:10px 6px;transition:color .25s,transform .15s}
    nav.navbar a:hover{color:var(--gold);transform:translateY(-2px)}
    .home-logo img{height:20px;display:block;transition:transform .3s,opacity .3s,filter .3s}
    .home-logo:hover img{transform:translateY(-2px);filter:brightness(1.2);opacity:.9}
    .menu-toggle{display:none;background:transparent;border:0;color:var(--cream);font-size:18px;cursor:pointer;padding:8px;line-height:0;-webkit-tap-highlight-color:transparent}
    .menu-toggle:focus{outline:2px solid rgba(198,166,100,.25);border-radius:6px}
    .menu-toggle svg{width:26px;height:26px;display:block}
    .menu-toggle .icon-x{display:none}
    .menu-toggle.open .icon-bars{display:none}
    .menu-toggle.open .icon-x{display:block}
    @media (max-width:768px){.menu-toggle{display:block}nav.navbar{position:absolute;top:var(--nav-height);left:0;right:0;background:rgba(11,19,43,.96);flex-direction:column;align-items:center;gap:22px;padding:24px 0;display:none;z-index:9998}.navbar.active{display:flex;animation:slideDown .3s forwards}@keyframes slideDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}}
    section.fullscreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 18px;position:relative}
    .navy-bg{background-color:var(--navy);color:var(--cream)}
    .hero .names{font-size:48px;margin:6px 0 6px}.hero .sub{font-size:13px;letter-spacing:2px;margin-bottom:12px}
    /* Background placeholder technique (actual images loaded via JS) */
    .lazy-bg{background-size:cover;background-position:center center;background-repeat:no-repeat;min-height:100vh}
    /* Home hero specific */
    #home{position:relative;color:white}
    #home::before{content:"";position:absolute;inset:0;background-color:rgba(0,0,0,.5);z-index:1}
    #home .inner{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center}
    .home-icon{width:100vw;max-width:1000px;height:auto}
    @media (min-width:800px){.home-icon{width:50vw;max-width:1000px}}
    /* popup */
    .popup{display:none;position:fixed;z-index:10000;left:0;top:0;width:100%;height:100%;background-color:rgba(0,0,0,.7);backdrop-filter:blur(4px)}
    .popup-content{background:center/cover no-repeat;color:white;margin:8% auto;padding:40px 30px;width:90%;max-width:400px;border-radius:20px;text-align:center;position:relative;box-shadow:0 5px 30px rgba(0,0,0,.5);animation:fadeIn .3s}
    #mapPopupCeremony .popup-content,#mapPopupReception .popup-content{color:black}
    .close{position:absolute;top:10px;right:15px;font-size:28px;font-weight:bold;color:white;cursor:pointer}
    #mapPopupCeremony .close,#mapPopupReception .close{color:black}
    @keyframes fadeIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
    /* form */
    #rsvp-form{display:flex;flex-direction:column;gap:12px;margin-top:10px}
    #rsvp-form label{font-weight:600;text-align:left;font-size:14px;color:white}
    #rsvp-form input,#rsvp-form select,#rsvp-form textarea{padding:10px 12px;font-family:'Cormorant Garamond',serif;font-size:15px;color:white;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.4);border-radius:6px;resize:none}
    #rsvp-form input::placeholder,#rsvp-form textarea::placeholder{color:rgba(255,255,255,.7)}
    #rsvp-form select option{color:black}
    #rsvp-form input:focus,#rsvp-form select:focus,#rsvp-form textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 6px rgba(198,166,100,.6)}
    .rsvp-btn{display:inline-block;margin-top:15px;padding:10px 18px;background:white;color:var(--navy);border:none;border-radius:8px;font-weight:600;cursor:pointer;transition:all .2s}
    .rsvp-btn[disabled]{opacity:.6;cursor:not-allowed;transform:none}
    .rsvp-btn:hover{background:rgba(255,255,255,.85);transform:scale(1.03)}
    footer{padding:20px 5px;background-color:var(--navy);color:var(--cream);text-align:center;font-family:'Cormorant Garamond',serif;font-size:15px;letter-spacing:.5px;border-top:1px solid rgba(198,166,100,.25)}
    footer a:hover{color:#d8b97d!important;text-shadow:0 0 6px rgba(198,166,100,.5);transform:translateY(-1px)}
  </style>
</head>
<body>
  <!-- HEADER / NAV -->
  <header class="topnav">
    <div class="nav-inner">
      <a href="#home" class="home-logo" aria-label="Home">
        <!-- LCP hero logo small -->
        <img src="cv-logo.png" alt="Caesar & Vera Logo" decoding="async" loading="eager" width="120" height="20">
      </a>

      <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu" aria-controls="navbar" aria-expanded="false">
        <svg class="icon-bars" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 6h18v2H3zM3 11h18v2H3zM3 16h18v2H3z"/></svg>
        <svg class="icon-x" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M18.3 5.71L12 12.01 5.71 5.71 4.29 7.12 10.59 13.41 4.29 19.71 5.71 21.12 12 14.83 18.29 21.12 19.71 19.71 13.41 13.41 19.71 7.12z"/></svg>
      </button>

      <nav class="navbar" id="navbar">
        <a href="#story">OUR STORY</a>
        <a href="#entourage">ENTOURAGE</a>
        <a href="#details">DETAILS</a>
        <a href="#rsvp">RSVP</a>
        <a href="#venue">VENUE</a>
      </nav>
    </div>
  </header>

  <!-- HERO / HOME — keep as LCP (eager) -->
  <section id="home" class="fullscreen hero lazy-bg" data-bg="background1.png" aria-label="Home">
    <div class="inner">
      <!-- Primary hero image: mark eager for LCP -->
      <img src="home.png" alt="Home" class="home-icon" loading="eager" decoding="sync" width="1200" height="800">
      <!-- Decorative animated GIF - lazy -->
      <img src="home1.gif" alt="" class="home-icon" loading="lazy" decoding="async" width="800" height="400" aria-hidden="true" style="margin-top:18px">
    </div>
  </section>

  <section id="story" class="fullscreen lazy-bg" data-bg="background4.png" aria-label="Our story">
    <div class="inner">
      <img src="story.png" alt="Story" class="story-icon" loading="lazy" decoding="async" width="900" height="600">
    </div>
  </section>

  <section id="entourage" class="fullscreen lazy-bg" data-bg="rsvp-popup.png" aria-label="Entourage">
    <div class="inner">
      <img src="entourage.png" alt="Entourage" class="entourage-icon" loading="lazy" decoding="async" width="900" height="600">
    </div>
  </section>

  <section id="details" class="fullscreen lazy-bg" data-bg="background4.png" aria-label="Details">
    <div class="inner">
      <img src="details.png" alt="Details" class="details-icon" loading="lazy" decoding="async" width="900" height="600">
    </div>
  </section>

  <section id="rsvp" class="fullscreen lazy-bg" data-bg="background3.png" aria-label="RSVP">
    <div class="inner">
      <img src="envelope.png" alt="Envelope" class="envelope-icon" loading="lazy" decoding="async" width="900" height="600" style="cursor:pointer">
      <img src="doily.png" alt="Doily" class="doily-icon" loading="lazy" decoding="async" width="700" height="400">
    </div>
  </section>

  <!-- RSVP Popup -->
  <div id="rsvpPopup" class="popup" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="rsvpTitle">
    <div class="popup-content" style="background:url('rsvp-popup.png') center/cover no-repeat;">
      <button class="close" aria-label="Close RSVP">&times;</button>
      <h2 id="rsvpTitle">RSVP</h2>
      <form id="rsvp-form" autocomplete="off">
        <label for="full-name">Name</label>
        <input type="text" id="full-name" required placeholder="Your full name">
        <label for="attending">Will you attend?</label>
        <select id="attending" required>
          <option value="">Select an option</option>
          <option value="Yes">Yes, I’ll be there</option>
          <option value="No">Sorry, I can’t attend</option>
        </select>
        <label for="message">Message</label>
        <textarea id="message" placeholder="Your note (optional)"></textarea>
        <button type="submit" class="rsvp-btn">Submit RSVP</button>
      </form>

      <div id="rsvp-confirmation" style="display:none;margin-top:15px;">
        <p id="confirmation-message"><br>We can’t wait to celebrate with you!<br><br>Thank you for your RSVP!</p>
      </div>
    </div>
  </div>

  <!-- VENUE (images clickable to open map popups) -->
  <section id="venue" class="fullscreen lazy-bg" data-bg="background2.png" aria-label="Venue">
    <div class="inner">
      <div class="venue-row" style="display:flex;flex-direction:column;gap:40px;align-items:center">
        <img src="ceremony.png" alt="Ceremony" class="ceremony-icon" loading="lazy" decoding="async" width="600" height="400" style="cursor:pointer;transition:transform .3s;" onclick="openPopup('mapPopupCeremony', this)">
        <img src="reception.png" alt="Reception" class="reception-icon" loading="lazy" decoding="async" width="600" height="400" style="cursor:pointer;transition:transform .3s;" onclick="openPopup('mapPopupReception', this)">
      </div>
    </div>
  </section>

  <!-- CEREMONY MAP POPUP -->
  <div id="mapPopupCeremony" class="popup" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="popup-content" style="max-width:500px;background:url('venue-popup.png') center/cover no-repeat;">
      <button class="close" aria-label="Close Ceremony">&times;</button>
      <h2>Ceremony Location</h2>
      <p style="font-size:15px;margin-bottom:15px;opacity:.9;">Saints Peter &amp; Paul Parish Church</p>
      <iframe
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3858.7902263296235!2d120.354258!3d16.0100093!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x339142c5059628d7%3A0x28fd05e4a852369a!2sSaints%20Peter%20%26%20Paul%20Parish%20Church%20-%20Calasiao%2C%20Pangasinan!5e0!3m2!1sen!2sph!4v1729234567890!5m2!1sen!2sph"
        width="100%"
        height="300"
        style="border:0;border-radius:10px;"
        allowfullscreen=""
        loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>
  </div>

  <!-- RECEPTION MAP POPUP -->
  <div id="mapPopupReception" class="popup" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="popup-content" style="max-width:500px;background:url('venue-popup.png') center/cover no-repeat;">
      <button class="close" aria-label="Close Reception">&times;</button>
      <h2>Reception Location</h2>
      <p style="font-size:15px;margin-bottom:15px;opacity:.9;">Village Royale</p>
      <iframe
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3866.12345!2d120.3715103!3d16.0185168!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x33914316b3c24c2b%3A0xcaff2f4cf9c5fce9!2sThe%20Village%20Royale!5e0!3m2!1sen!2sph!4v1729201234567!5m2!1sen!2sph"
        width="100%"
        height="300"
        style="border:0;border-radius:10px;"
        allowfullscreen=""
        loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>
  </div>

  <!-- FOOTER -->
  <footer>
    <img src="cv-logo.png" alt="CV Atelier Logo" style="height:20px;margin:4px 0 8px" loading="lazy" decoding="async">
    <p style="margin:6px 0 12px;font-weight:400;opacity:.9;">Designed by CV Atelier</p>
    <p style="margin:0;font-size:13px;font-style:italic;color:rgba(250,243,224,.8);">For inquiries, check our social media accounts and message us.</p>
    <div style="margin-top:18px;">
      <a href="https://www.tiktok.com/@cvatelierofficial" target="_blank" rel="noopener" title="TikTok" style="color:rgba(250,243,224,.8);margin:0 12px;font-size:20px;text-decoration:none;transition:all .3s">
        <i class="fab fa-tiktok" aria-hidden="true"></i>
      </a>
      <a href="https://www.instagram.com/cvatelierofficial" target="_blank" rel="noopener" title="Instagram" style="color:rgba(250,243,224,.8);margin:0 12px;font-size:20px;text-decoration:none;transition:all .3s">
        <i class="fab fa-instagram" aria-hidden="true"></i>
      </a>
      <a href="https://www.facebook.com/cvatelierofficial" target="_blank" rel="noopener" title="Facebook" style="color:rgba(250,243,224,.8);margin:0 12px;font-size:20px;text-decoration:none;transition:all .3s">
        <i class="fab fa-facebook-f" aria-hidden="true"></i>
      </a>
      <a href="https://x.com/cvatelier" target="_blank" rel="noopener" title="X (Twitter)" style="color:rgba(250,243,224,.8);margin:0 12px;font-size:20px;text-decoration:none;transition:all .3s">
        <i class="fab fa-x-twitter" aria-hidden="true"></i>
      </a>
      <a href="mailto:cvatelierofficial@gmail.com" title="Email" style="color:rgba(250,243,224,.8);margin:0 12px;font-size:20px;text-decoration:none;transition:all .3s">
        <i class="fas fa-envelope" aria-hidden="true"></i>
      </a>
    </div>

    <!-- Background audio (metadata only until user interacts) -->
    <audio id="bgAudio" src="music.mp3" preload="metadata" loop></audio>
  </footer>

  <!-- ======= Scripts (deferred behavior implemented here) ======= -->
  <script>
    (function () {
      "use strict";

      // ----- NAV MENU -----
      const menuToggle = document.getElementById("menuToggle");
      const navbar = document.getElementById("navbar");
      const links = document.querySelectorAll(".navbar a");

      function openMenu() {
        navbar.classList.add("active");
        menuToggle.classList.add("open");
        menuToggle.setAttribute("aria-expanded", "true");
        document.body.style.overflow = "hidden";
      }
      function closeMenu() {
        navbar.classList.remove("active");
        menuToggle.classList.remove("open");
        menuToggle.setAttribute("aria-expanded", "false");
        document.body.style.overflow = "";
      }

      menuToggle.addEventListener("click", function (e) {
        e.stopPropagation();
        if (navbar.classList.contains("active")) closeMenu();
        else openMenu();
      });

      links.forEach(function (link) {
        link.addEventListener("click", function () { closeMenu(); });
      });

      window.addEventListener("click", function (e) {
        if (!navbar.contains(e.target) && !menuToggle.contains(e.target)) closeMenu();
      }, { passive: true });

      window.addEventListener("keydown", function (e) {
        if (e.key === "Escape") closeMenu();
      });

      window.addEventListener("resize", function () {
        if (window.innerWidth > 768) closeMenu();
      });

      // ----- LAZY BACKGROUNDS (IntersectionObserver) -----
      const lazySections = document.querySelectorAll(".lazy-bg");
      if ("IntersectionObserver" in window && lazySections.length) {
        const io = new IntersectionObserver((entries, obs) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              const el = entry.target;
              const bg = el.getAttribute("data-bg");
              if (bg) {
                el.style.backgroundImage = `url('${bg}')`;
                // small fade
                el.style.opacity = 0;
                requestAnimationFrame(() => { el.style.transition = "opacity .4s"; el.style.opacity = 1; });
                obs.unobserve(el);
              }
            }
          });
        }, { rootMargin: "200px 0px" });
        lazySections.forEach(sec => io.observe(sec));
      } else {
        // Fallback: load all backgrounds
        lazySections.forEach(sec => { const bg = sec.getAttribute("data-bg"); if (bg) sec.style.backgroundImage = `url('${bg}')`; });
      }

      // ----- POPUPS HANDLING -----
      function openPopup(id, el) {
        if (el) { el.style.transform = "scale(1.03)"; setTimeout(() => el.style.transform = "scale(1)", 200); }
        const popup = document.getElementById(id);
        if (popup) {
          popup.style.display = "block";
          popup.style.opacity = 0;
          setTimeout(() => (popup.style.opacity = 1), 10);
        }
      }
      window.openPopup = openPopup;

      // Attach close buttons and outside-click close for all popups
      document.querySelectorAll(".popup").forEach(popup => {
        const closeBtn = popup.querySelector(".close");
        if (closeBtn) closeBtn.addEventListener("click", () => {
          popup.style.opacity = 0;
          setTimeout(() => (popup.style.display = "none"), 200);
        });

        window.addEventListener("click", (event) => {
          if (event.target === popup) {
            popup.style.opacity = 0;
            setTimeout(() => (popup.style.display = "none"), 200);
          }
        }, { passive: true });
      });

      // ----- RSVP POPUP trigger -----
      const envelope = document.querySelector("#rsvp .envelope-icon");
      const popup = document.getElementById("rsvpPopup");
      if (envelope && popup) {
        envelope.addEventListener("click", function () {
          popup.style.display = "block";
          popup.style.opacity = 0;
          setTimeout(() => (popup.style.opacity = 1), 10);
        }, { passive: true });
      }

      // ----- RSVP FORM SUBMISSION (Google Apps Script) -----
      const form = document.getElementById("rsvp-form");
      const confirmation = document.getElementById("rsvp-confirmation");
      const scriptURL = "https://script.google.com/macros/s/AKfycbwen0OHfrCxyTv70qfJAz78p_wDxjXO068F8dOxGPTl9Mb-YNRZSY0droVQUFCcC6zf5w/exec";

      if (form) {
        form.addEventListener("submit", async function (e) {
          e.preventDefault();
          const submitBtn = form.querySelector(".rsvp-btn");
          if (!submitBtn) return;

          // Guard against double submission (also visual)
          if (submitBtn.disabled) return;
          submitBtn.disabled = true;
          const originalText = submitBtn.textContent;
          submitBtn.textContent = "Submitting...";

          try {
            const formData = new FormData();
            formData.append("name", document.getElementById("full-name").value || "");
            formData.append("attending", document.getElementById("attending").value || "");
            formData.append("message", document.getElementById("message").value || "");

            const response = await fetch(scriptURL, { method: "POST", body: formData, mode: "cors" });
            // Some Apps Script endpoints return a text/html or redirect; handle gracefully
            let result;
            try { result = await response.json(); } catch (err) { result = { status: response.ok ? "success" : "error" }; }

            if (result && result.status === "success" || response.ok) {
              form.style.display = "none";
              confirmation.style.display = "block";
            } else {
              alert("Something went wrong. Please try again.");
              console.error("RSVP error:", result);
            }
          } catch (error) {
            alert("Error submitting RSVP. Please try again later.");
            console.error(error);
          } finally {
            // Re-enable after short delay to avoid accidental double-clicks
            setTimeout(() => {
              submitBtn.disabled = false;
              submitBtn.textContent = originalText;
            }, 2000);
          }
        });
      }

      // ----- BACKGROUND AUDIO: autoplay on first scroll/click/touch (as requested) -----
      const bgAudio = document.getElementById("bgAudio");
      if (bgAudio) {
        let audioStarted = false;

        const startAudio = () => {
          if (audioStarted) return;
          audioStarted = true;
          // Begin loading the full audio (in case only metadata was loaded)
          try {
            bgAudio.load();
            const playPromise = bgAudio.play();
            if (playPromise !== undefined) {
              playPromise.catch(() => { /* Autoplay blocked on some browsers; user interaction needed */ });
            }
          } catch (err) { /* ignore */ }
        };

        // start on first meaningful interaction
        document.addEventListener("scroll", startAudio, { once: true, passive: true });
        document.addEventListener("click", startAudio, { once: true });
        document.addEventListener("touchstart", startAudio, { once: true });
      }

      // ----- Accessibility: ensure header focusable elements & keyboard navigation -----
      (function setupFocus() {
        const focusable = document.querySelectorAll("a, button, input, select, textarea");
        focusable.forEach(el => el.setAttribute("tabindex", el.hasAttribute("tabindex") ? el.getAttribute("tabindex") : "0"));
      })();

      // ----- Small perf hint printed to console for debugging -----
      if (window && window.performance) {
        console.info("Perf: DOMContentLoaded at " + Math.round(performance.now()) + "ms");
      }

    })();
  </script>
</body>
</html>
